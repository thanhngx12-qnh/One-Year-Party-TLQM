<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad2)"/>
  <circle cx="300" cy="300" r="230" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Mystery Gift Box -->
  <g filter="url(#boxShadow)">
    <!-- Box Body -->
    <rect x="150" y="240" width="300" height="240" rx="16" fill="url(#boxGrad)" stroke="#7f1d1d" stroke-width="4"/>
    <!-- Box Lid -->
    <rect x="130" y="190" width="340" height="60" rx="12" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    
    <!-- Vertical Gold Ribbon -->
    <rect x="275" y="190" width="50" height="290" fill="url(#goldRibbon)" stroke="#92400e" stroke-width="2"/>
    <!-- Horizontal Gold Ribbon on Lid -->
    <rect x="130" y="205" width="340" height="30" fill="url(#goldRibbon)" stroke="#92400e" stroke-width="2"/>
    
    <!-- Big Gold Bow Knot -->
    <path d="M300 190 C 250 120, 180 150, 240 190 Z" fill="url(#goldRibbon)" stroke="#92400e" stroke-width="2"/>
    <path d="M300 190 C 350 120, 420 150, 360 190 Z" fill="url(#goldRibbon)" stroke="#92400e" stroke-width="2"/>
    <circle cx="300" cy="190" r="22" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    
    <!-- Secret Mystery Badge -->
    <rect x="200" y="320" width="200" height="60" rx="12" fill="#1e293b" stroke="url(#goldRibbon)" stroke-width="3"/>
    <text x="300" y="345" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">THÙNG QUÀ BÍ MẬT</text>
    <text x="300" y="368" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GALA TLQM GAMESHOW</text>
  </g>
  
  <text x="300" y="530" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#991b1b" text-anchor="middle">🎁 PHẦN THƯỞNG ĐỘI CHIẾN THẮNG</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <!-- Ambient glow circle -->
  <circle cx="300" cy="300" r="220" fill="#38bdf8" opacity="0.08"/>
  
  <!-- Power Bank Body -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="100" width="240" height="400" rx="36" fill="url(#bodyGrad)" stroke="url(#metalRim)" stroke-width="4"/>
    <!-- Top Port Plate -->
    <rect x="210" y="110" width="180" height="20" rx="6" fill="#334155" opacity="0.8"/>
    <!-- USB Ports -->
    <rect x="230" y="114" width="36" height="12" rx="3" fill="#0f172a"/>
    <rect x="282" y="115" width="36" height="10" rx="5" fill="#0284c7"/>
    <rect x="334" y="114" width="36" height="12" rx="3" fill="#0f172a"/>
    
    <!-- Digital LED Display Circle -->
    <circle cx="300" cy="220" r="52" fill="#0f172a" stroke="url(#goldAccent)" stroke-width="3"/>
    <text x="300" y="226" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">100%</text>
    <text x="300" y="252" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FAST CHARGE</text>
    
    <!-- Brand Name -->
    <text x="300" y="370" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#1e293b" letter-spacing="4" text-anchor="middle">DELITES</text>
    <text x="300" y="398" font-family="'Montserrat', sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1" text-anchor="middle">10.000 mAh • Polymer</text>

    <!-- Power button side notch -->
    <rect x="418" y="180" width="6" height="40" rx="3" fill="#94a3b8"/>
  </g>
  
  <!-- Subtle Badge overlay -->
  <g transform="translate(300, 465)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="#0b9444" opacity="0.9"/>
    <text x="0" y="4" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">GIẢI MAY MẮN</text>
  </g>
</svg>
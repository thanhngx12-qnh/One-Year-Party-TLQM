<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGrad2)" />

  <!-- Ambient Light Circles -->
  <circle cx="650" cy="180" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow2)" />
  <circle cx="180" cy="620" r="180" fill="#f59e0b" opacity="0.2" filter="url(#glow2)" />

  <!-- Top Demo Warning Pill -->
  <g transform="translate(400, 80)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#f59e0b" opacity="0.95" />
    <text x="0" y="8" fill="#1e1b4b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">
      🧪 BẢN TẬP DƯỢT THỬ NGHIỆM
    </text>
  </g>

  <!-- Center Card Illustration -->
  <g transform="translate(400, 380)">
    <!-- Decorative Frame -->
    <rect x="-260" y="-210" width="520" height="420" rx="28" fill="#ffffff" opacity="0.08" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Big Center Graphic: Victory Star -->
    <circle cx="0" cy="-40" r="110" fill="url(#amberGrad)" opacity="0.2" filter="url(#glow2)" />
    
    <!-- Victory Star / Trophy -->
    <path d="M 0 -130 L 35 -40 L 130 -40 L 55 15 L 85 105 L 0 50 L -85 105 L -55 15 L -130 -40 L -35 -40 Z" fill="#fbbf24" filter="url(#glow2)" />

    <!-- Cartoon Victory Hand -->
    <circle cx="-130" cy="-30" r="42" fill="#fed7aa" stroke="#eab308" stroke-width="4" />
    <circle cx="130" cy="-30" r="42" fill="#fed7aa" stroke="#eab308" stroke-width="4" />
    <text x="-130" y="-20" font-size="34" text-anchor="middle">✌️</text>
    <text x="130" y="-20" font-size="34" text-anchor="middle">✌️</text>

    <!-- Pose Title inside card -->
    <text x="0" y="115" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      DÁNG TẬP DƯỢT 2: QUYẾT TÂM CHIẾN THẮNG
    </text>
    <text x="0" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      Tất cả thành viên giơ tay số 2 (Peace ✌️) và tạo dáng dứt khoát!
    </text>
  </g>

  <!-- Bottom Notice -->
  <g transform="translate(400, 715)">
    <rect x="-240" y="-20" width="480" height="40" rx="12" fill="#0f172a" opacity="0.8" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <text x="0" y="6" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      🔒 Nhập mật khẩu Ban Tổ Chức để mở khóa 5 dáng chụp thật
    </text>
  </g>
</svg>

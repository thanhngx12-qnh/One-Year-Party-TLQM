<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="umbrellaCanopy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#0b9444"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="umbrellaShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14532d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad3)"/>
  <circle cx="300" cy="280" r="230" fill="#0b9444" opacity="0.1"/>
  
  <g filter="url(#umbrellaShadow)">
    <!-- Umbrella Canopy Top Arc -->
    <path d="M 100 300 Q 300 100 500 300 C 450 280, 420 280, 380 300 C 340 280, 310 280, 270 300 C 230 280, 200 280, 160 300 C 130 280, 115 285, 100 300 Z" fill="url(#umbrellaCanopy)" stroke="#14532d" stroke-width="4"/>
    
    <!-- Umbrella ribs highlight -->
    <path d="M 300 130 Q 280 230 270 300" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <path d="M 300 130 Q 320 230 380 300" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    
    <!-- Top Tip Ferrule -->
    <rect x="295" y="110" width="10" height="24" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    
    <!-- Shaft -->
    <line x1="300" y1="290" x2="300" y2="460" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    
    <!-- J-Hook Handle -->
    <path d="M 300 460 C 300 510, 240 510, 240 470" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
    
    <!-- TLQM Logo on Umbrella -->
    <circle cx="300" cy="220" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="226" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#223873" text-anchor="middle">TLQM</text>
  </g>
  
  <text x="300" y="540" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="900" fill="#166534" text-anchor="middle">☂️ Ô CẦM TAY THƯƠNG HIỆU TLQM</text>
</svg>